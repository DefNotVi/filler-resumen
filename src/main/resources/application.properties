spring.application.name=filler

server.port=8081

# Sesion azure
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/discovery/v2.0/keys

# ==========================================
# CONEXIÓN A POSTGRESQL LOCAL EN DOCKER
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=elkesoeweko
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# CONFIGURACIÓN DE KAFKA CONSUMER
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=resumen-historial-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=cl.resumen.filler.dto.AnaliticaResumenDTO